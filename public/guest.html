<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendee check-in display</title><style>body{margin:0;min-height:100svh;background:#0c0916;color:#9ca3af;display:grid;place-items:center;font:24px Arial,sans-serif;text-align:center}#symbol{font-size:clamp(150px,35vw,440px);line-height:1;font-weight:bold}p{margin:24px 0}button{position:fixed;bottom:20px;right:20px;background:#171329;color:#bbb;border:1px solid #33284e;padding:10px 14px;border-radius:8px;cursor:pointer}</style></head><body><main role="status" aria-live="polite"><div id="symbol">—</div><p id="label">Ready for check-in</p></main><section style="position:fixed;top:16px;left:16px;right:16px;font-size:14px"><button id="start-camera" style="position:static">Start iPhone camera</button> <button id="stop-camera" style="position:static" hidden>Stop camera</button><p id="camera-message">Camera frames are sent over HTTPS to the check-in server, processed in memory, and never saved.</p><video id="phone-video" playsinline muted style="width:120px;border-radius:12px" hidden></video></section><button id="fullscreen">Full screen</button><script>
const symbol=document.getElementById('symbol'),label=document.getElementById('label');let local=false,started=false;function render(r){if(r.updatedAt&&Date.now()/1000-r.updatedAt>8)r={status:'idle'};const good=['checked_in','already_checked_in'].includes(r.status),idle=r.status==='idle';symbol.textContent=idle?'—':good?'✓':'✕';symbol.style.color=idle?'#9ca3af':good?'#31d6a5':'#ff6577';label.textContent=idle?'Ready for check-in':good?'Checked in':'Please see the organizer'}async function update(){if(local){try{render(JSON.parse(localStorage.getItem('blade-demo-display')||'{"status":"idle"}'))}catch{render({status:'idle'})}return}try{const r=await fetch('/api/display',{cache:'no-store'});if(r.status===403){label.textContent='Pair this phone first';document.getElementById('camera-message').textContent='Open /pair.html to connect this device.';return}if(!r.ok)throw Error();const data=await r.json();if(!data.status)throw Error();started=true;render(data)}catch{if(!started){local=true;update()}else{symbol.textContent='—';symbol.style.color='#9ca3af';label.textContent='Connection lost'}}}document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};const video=document.getElementById('phone-video'),startButton=document.getElementById('start-camera'),stopButton=document.getElementById('stop-camera'),cameraMessage=document.getElementById('camera-message');let stream=null,sending=false,lastSent=0;const canvas=document.createElement('canvas');function stopCamera(){sending=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;video.hidden=true;startButton.hidden=false;stopButton.hidden=true;cameraMessage.textContent='Camera stopped.'}stopButton.onclick=stopCamera;startButton.onclick=async()=>{if(local){cameraMessage.textContent='Can’t reach the check-in server. Check the connection and reload this page.';return}if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){cameraMessage.textContent='Camera access requires HTTPS. Open this site’s https:// address.';return}startButton.disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();video.hidden=false;sending=true;startButton.hidden=true;stopButton.hidden=false;cameraMessage.textContent='Camera active. Keep this page visible and your iPhone unlocked.';sendFrame()}catch(e){stopCamera();cameraMessage.textContent='Could not start camera: '+e.message}finally{startButton.disabled=false}};async function sendFrame(){if(!sending)return;try{if(video.readyState>=2){const scale=Math.min(640/video.videoWidth,480/video.videoHeight,1);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.65));if(blob){const r=await fetch('/api/camera',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});if(!r.ok)throw Error('Camera connection failed ('+r.status+').');lastSent=Date.now()}}}catch(e){cameraMessage.textContent=e.message+' Retrying…'}if(sending)setTimeout(sendFrame,900)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)stopCamera()});window.addEventListener('pagehide',stopCamera);update();setInterval(update,500);
</script></body></html>
