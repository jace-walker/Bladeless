<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair check-in device</title><style>body{background:#060912;color:#fff;font:18px Arial;margin:0;display:grid;place-items:center;min-height:100svh}main{max-width:420px;padding:28px}p{color:#aaa;line-height:1.6}input,button{box-sizing:border-box;width:100%;padding:15px;margin-top:14px;border:1px solid #383346;border-radius:8px;background:#111727;color:#fff;font:inherit}button{background:#7924e8;cursor:pointer}</style></head><body><main><h1>Pair this device</h1><p>Use the phone pairing key for the attendee camera, or the admin key on the organizer’s computer. Keys appear in the server terminal.</p><form id="pair"><label for="key">Pairing key</label><input id="key" type="password" autocomplete="off" required><button>Connect</button></form><p id="message" role="status"></p></main><script>document.getElementById('pair').onsubmit=async e=>{e.preventDefault();const message=document.getElementById('message');try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.getElementById('key').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.target}catch(e){message.textContent=e.message||'Connection failed'}}</script></body></html>
