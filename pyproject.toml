[project]
name = "blade-checkin"
version = "0.2.0"
description = "Face check-in for club events: Flask API on Vercel, Neon Postgres + pgvector"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "deepface==0.0.102",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "python-dotenv==1.2.4",
]

[tool.vercel]
# Tells Vercel which file holds the web app.
entrypoint = "app:app"
